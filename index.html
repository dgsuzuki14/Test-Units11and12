<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests - Units 11 and 12</title>
<style>
  :root{--navy:#152a52;--blue:#2563eb;--blue-dark:#1d4ed8;--ink:#172033;--muted:#5b6475;--canvas:#f4f7fb;--paper:#fff;--soft-blue:#edf4ff;--soft-red:#fff1f1;--red:#b42318;--green:#15803d;--shadow:0 16px 42px rgba(21,42,82,.13)}
  *{box-sizing:border-box}
  html,body,#app{min-height:100%;margin:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--canvas);color:var(--ink);line-height:1.45}
  button,input{font:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.5}
  body.exam-active{user-select:none;-webkit-user-select:none}
  .topbar{background:linear-gradient(120deg,var(--navy),#244f94);color:#fff;padding:24px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px}
  .brand{font-size:clamp(1.45rem,3vw,2rem);font-weight:700;margin-top:10px}
  .pagewidth{min(1120px,calc(100% - 32px));margin:0 auto;padding:30px 0 48px}
  .home{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
  .home-card{width:min(760px,100%);border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
  .home-head{background:linear-gradient(135deg,var(--navy),#2b5ba8);padding:40px 50px;color:#fff}
  .home-head h1{margin:0;font-size:clamp(2rem,5vw,3rem)}
  .home-body{padding:32px 50px 42px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label{display:block;font-size:.88rem;font-weight:700;margin-bottom:7px}
  input{width:100%;border:1px solid #bdc7d7;border-radius:9px;padding:12px 13px;background:#fff}
  .btn{border:0;border-radius:9px;padding:12px 17px;min-height:43px;font-weight:700}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-secondary{background:#fff;border:1px solid #cfd8e6;color:#334155}
  .btn-danger{background:var(--soft-red);border:1px solid #eca3a3;color:var(--red);width:100%}
  .home .btn{margin-top:26px;width:100%}
  .error{color:var(--red);font-size:.9rem;margin:10px 0 0}
  .exam-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:21px}
  .progress-area{min-width:min(300px,36vw);text-align:right}
  .progress-track{height:9px;background:#dce4f1;border-radius:999px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),#04a6c9);width:0%;transition:width .2s ease}
  .exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
  .card{background:var(--paper);border:1px solid #e3e9f2;border-radius:17px;box-shadow:0 8px 24px rgba(21,42,82,.06)}
  .question-card{padding:34px}
  .question-text{font-size:clamp(1.1rem,2vw,1.32rem);line-height:1.55;margin:0 0 24px;white-space:pre-wrap}
  .options{display:grid;gap:11px}
  .option{display:flex;align-items:center;justify-content:flex-start;gap:13px;padding:14px;border:1px solid #d5ddea;border-radius:11px;background:#fff;cursor:pointer;width:100%;text-align:left}
.option input{flex-shrink:0;flex-grow:0;width:18px;height:18px;margin:0}
.option span{flex:1;text-align:left}
  .option.selected{border-color:var(--blue);background:#eff6ff}
  .option input{margin:4px 0 0}
  .question-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:30px}
  .nav-card{padding:20px;position:sticky;top:18px}
  .question-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .q-nav{height:39px;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:8px;font-size:.8rem;font-weight:700}
  .q-nav.current{border-color:var(--blue);outline:3px solid rgba(37,99,235,.16)}
  .q-nav.answered{background:#e9f8ef;color:#166534;border-color:#8ad2a3}
  .lock-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#182238,#4a1f2a)}
  .lock-card{width:min(560px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .code-box{padding:13px;background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;color:#9a3412;font-family:'Courier New',monospace;margin:20px 0}
  .result-card{padding:38px;text-align:center}
  .hidden{display:none}
  .spinner{border:4px solid #e2e8f0;border-top:4px solid var(--blue);border-radius:50%;width:36px;height:36px;animation:spin 1s linear infinite;margin:20px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ============================================================
   1. CONFIGURACIÓN — AQUÍ VA TU URL DE APPS SCRIPT
   ============================================================ */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxb-XgcwSa8isVJvBf1_H5RKL74MfXhJ9c6PhAfuQx6_eFTVcrEEmatchyWqfsMaXyTvA/exec";

/* ============================================================
   2. ESTADO GLOBAL
   ============================================================ */
const state = {
  screen: "home",
  student: { firstName: "", lastName: "" },
  idIntento: null,
  preguntas: [],
  respuestas: {},
  current: 0,
  active: false,
  locked: false,
  lockCode: "",
  loading: false,
  errorMsg: "",
  resultado: null
};

const LOCKCODES = {
  visibility: "VX-47-KAPPA",
  focus: "FW-83-ORBIT",
  fullscreen: "FS-19-NOVA",
  context: "RC-62-CEDAR",
  shortcut: "KS-35-ONYX"
};

/* ============================================================
   3. UTILIDADES
   ============================================================ */
function esc(t) {
  return String(t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function answeredCount() {
  return Object.keys(state.respuestas).length;
}

async function llamarBackendGET(params) {
  const url = BACKEND_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

async function llamarBackendPOST(payload) {
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita bloqueo por CORS
    body: JSON.stringify(payload)
  });
  return res.json();
}

function enviarEvento(tipoEvento) {
  if (!state.idIntento) return;
  llamarBackendPOST({
    action: "log",
    idIntento: state.idIntento,
    tipoEvento: tipoEvento,
    timestamp: new Date().toISOString()
  }).catch(() => {});
}

function requestFullscreen() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  } catch (e) {}
}

/* ============================================================
   4. RENDER
   ============================================================ */
function render() {
  const app = document.getElementById("app");
  document.body.className = (state.screen === "exam") ? "exam-active" : "";

  if (state.screen === "home") { app.innerHTML = homeTemplate(); return; }
  if (state.screen === "loading") { app.innerHTML = loadingTemplate(); return; }
  if (state.screen === "exam") { app.innerHTML = examTemplate(); return; }
  if (state.screen === "lock") { app.innerHTML = lockTemplate(); return; }
  if (state.screen === "results") { app.innerHTML = resultsTemplate(); return; }
}

function homeTemplate() {
  return `
  <main class="home">
    <section class="home-card">
      <div class="home-head"><h1>Grammar Assessment</h1><p>Passive Voice · Appositives · Definitions</p></div>
      <div class="home-body">
        <div class="form-grid">
          <div><label for="firstName">First name</label><input id="firstName" placeholder="Enter your first name"></div>
          <div><label for="lastName">Last name</label><input id="lastName" placeholder="Enter your last name"></div>
        </div>
        <p style="color:var(--muted);font-size:.85rem;margin-top:16px">
          Closing this tab, switching windows, or exiting full screen will lock the assessment.
        </p>
        ${state.errorMsg ? `<p class="error">${esc(state.errorMsg)}</p>` : ""}
        <button class="btn btn-primary" onclick="iniciarExamen()">Start assessment</button>
      </div>
    </section>
  </main>`;
}

function loadingTemplate() {
  return `
  <main class="home">
    <section class="home-card">
      <div class="home-body" style="text-align:center;padding:60px 40px">
        <div class="spinner"></div>
        <p>Loading your questions, please wait...</p>
      </div>
    </section>
  </main>`;
}

function examTemplate() {
  const p = state.preguntas[state.current];
  const optionsHtml = p.opciones.map((o, i) => {
    const selected = state.respuestas[p.id] === o;
    return `
      <label class="option ${selected ? "selected" : ""}">
        <input type="radio" name="answer" value="${esc(o)}" ${selected ? "checked" : ""} onchange="guardarRespuesta('${p.id}', this.value)">
        <span>${esc(o)}</span>
      </label>`;
  }).join("");

  const navHtml = state.preguntas.map((item, i) => {
    const cls = ["q-nav"];
    if (i === state.current) cls.push("current");
    if (state.respuestas[item.id]) cls.push("answered");
    return `<button class="${cls.join(" ")}" onclick="irAPregunta(${i})">${i + 1}</button>`;
  }).join("");

  return `
  <header class="topbar">
    <div class="brand">Grammar Assessment</div>
  </header>
  <main class="pagewidth">
    <div class="exam-header">
      <div><h1>Assessment in progress</h1><p>Student: ${esc(state.student.firstName)} ${esc(state.student.lastName)}</p></div>
      <div class="progress-area">
        <div>${answeredCount()} of ${state.preguntas.length} answered</div>
        <div class="progress-track"><div class="progress-bar" style="width:${(answeredCount()/state.preguntas.length)*100}%"></div></div>
      </div>
    </div>
    <div class="exam-layout">
      <section class="card question-card">
        <p style="color:var(--muted);font-size:.8rem;font-weight:700">QUESTION ${state.current + 1} OF ${state.preguntas.length}</p>
        <h2 class="question-text">${esc(p.pregunta)}</h2>
        <div class="options">${optionsHtml}</div>
        <div class="question-actions">
          <button class="btn btn-secondary" ${state.current === 0 ? "disabled" : ""} onclick="anteriorPregunta()">Previous</button>
          ${state.current === state.preguntas.length - 1
            ? `<button class="btn btn-primary" onclick="enviarExamen()">Finish assessment</button>`
            : `<button class="btn btn-primary" onclick="siguientePregunta()">Next</button>`}
        </div>
      </section>
      <aside class="card nav-card">
        <h2>Question navigation</h2>
        <div class="question-nav">${navHtml}</div>
        <button class="btn btn-danger" style="margin-top:20px" onclick="enviarExamen()">Submit assessment</button>
      </aside>
    </div>
  </main>`;
}

function lockTemplate() {
  return `
  <main class="lock-wrap">
    <section class="lock-card">
      <h1>Assessment locked</h1>
      <p>The assessment session has been interrupted and is now locked. Please ask your instructor to restore access.</p>
      <div class="code-box">Session reference: ${esc(state.lockCode)}</div>
      <label for="unlockPassword">Instructor code</label>
      <input id="unlockPassword" type="password" placeholder="Enter unlock code" onkeydown="if(event.key==='Enter') desbloquearExamen()">
      <button class="btn btn-primary" style="margin-top:14px" onclick="desbloquearExamen()">Unlock assessment</button>
      <p id="unlockError" class="error"></p>
    </section>
  </main>`;
}

function resultsTemplate() {
  const r = state.resultado;
  return `
  <main class="home">
    <section class="home-card result-card">
      <h1>Assessment submitted</h1>
      <p>Thank you, ${esc(state.student.firstName)} ${esc(state.student.lastName)}.</p>
      <p style="color:var(--muted)">Your responses were received and recorded successfully.</p>
      ${r && typeof r.puntaje !== "undefined"
        ? `<p style="margin-top:10px;font-weight:700">Score: ${r.puntaje} / ${r.total}</p>`
        : ""}
    </section>
  </main>`;
}

/* ============================================================
   5. ACCIONES
   ============================================================ */
async function iniciarExamen() {
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();

  if (!firstName || !lastName) {
    state.errorMsg = "Please enter your first name and last name before starting.";
    render();
    return;
  }

  state.student = { firstName, lastName };
  state.errorMsg = "";
  state.screen = "loading";
  render();

  try {
    const respuesta = await llamarBackendGET({ action: "start", nombre: firstName, apellido: lastName });

    if (respuesta.error) {
      state.screen = "home";
      state.errorMsg = "Could not load questions: " + respuesta.error;
      render();
      return;
    }

    state.idIntento = respuesta.idIntento;
    state.preguntas = respuesta.preguntas;
    state.current = 0;
    state.respuestas = {};
    state.active = true;
    state.locked = false;
    state.screen = "exam";
    render();
    requestFullscreen();

  } catch (err) {
    state.screen = "home";
    state.errorMsg = "Network error: " + err.message;
    render();
  }
}

function guardarRespuesta(idPregunta, valor) {
  state.respuestas[idPregunta] = valor;
  render();
}

function irAPregunta(index) { state.current = index; render(); }
function anteriorPregunta() { if (state.current > 0) { state.current--; render(); } }
function siguientePregunta() { if (state.current < state.preguntas.length - 1) { state.current++; render(); } }

async function enviarExamen() {
  state.active = false;
  try {
    const respuesta = await llamarBackendPOST({
      action: "submit",
      idIntento: state.idIntento,
      respuestas: state.respuestas
    });
    state.resultado = respuesta;
  } catch (err) {
    state.resultado = { error: err.message };
  }
  state.screen = "results";
  render();
}

function bloquearExamen(tipo) {
  if (!state.active || state.locked) return;
  state.locked = true;
  state.active = false;
  state.lockCode = LOCKCODES[tipo] || "EV-00-UNKNOWN";
  enviarEvento(tipo);
  state.screen = "lock";
  render();
}

function desbloquearExamen() {
  const input = document.getElementById("unlockPassword");
  const error = document.getElementById("unlockError");
  // El código de desbloqueo NO vive en este archivo; lo define el profesor y lo comparte aparte.
  const CODIGO_DESBLOQUEO = "loquito1920";
  if (input.value !== CODIGO_DESBLOQUEO) {
    error.textContent = "Incorrect unlock code.";
    return;
  }
  state.locked = false;
  state.active = true;
  state.screen = "exam";
  render();
  requestFullscreen();
}

/* ============================================================
   6. LISTENERS DE BLOQUEO (disuasorios, ver limitaciones discutidas)
   ============================================================ */
document.addEventListener("visibilitychange", function () {
  if (document.hidden) bloquearExamen("visibility");
});
window.addEventListener("blur", function () {
  bloquearExamen("focus");
});
document.addEventListener("fullscreenchange", function () {
  if (state.active && !document.fullscreenElement) bloquearExamen("fullscreen");
});
document.addEventListener("contextmenu", function (event) {
  if (state.active) { event.preventDefault(); bloquearExamen("context"); }
});
document.addEventListener("keydown", function (event) {
  if (!state.active) return;
  const key = event.key.toUpperCase();
  const blocked =
    event.key === "F12" ||
    (event.ctrlKey && event.shiftKey && ["I","J","C"].indexOf(key) !== -1) ||
    (event.ctrlKey && ["U","P","S"].indexOf(key) !== -1) ||
    (event.altKey && event.key === "Tab");
  if (blocked) { event.preventDefault(); bloquearExamen("shortcut"); }
});

render();
</script>
</body>
</html>
